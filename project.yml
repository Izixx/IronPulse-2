# XcodeGen spec — génère MuscuLog.xcodeproj à partir de ce fichier.
#   macOS  : brew install xcodegen && xcodegen generate
#   CI     : voir .github/workflows/build.yml
#
# Pourquoi XcodeGen ? Le projet est développé sous Windows, sans Mac.
# Le .xcodeproj (pbxproj) est régénéré automatiquement à chaque build CI,
# ce qui évite d'avoir un fichier projet binaire impossible à relire/merger.

name: MuscuLog

options:
  bundleIdPrefix: com.example
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: fr

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_STRICT_CONCURRENCY: minimal
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES

targets:

  MuscuLog:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: MuscuLog
      - path: Support/Info.plist
        buildPhase: none
    settings:
      base:
        PRODUCT_NAME: MuscuLog
        PRODUCT_BUNDLE_IDENTIFIER: com.example.musculog
        INFOPLIST_FILE: Support/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        # Pas de team : le build CI est non signé, Sideloadly signe ensuite.
        # ------------------------------------------------------------------
        # Compte développeur Apple PAYANT uniquement : décommenter les deux
        # lignes ci-dessous (HealthKit + App Groups ne sont pas disponibles
        # avec un Apple ID gratuit), et créer Support/MuscuLog.entitlements.
        # ------------------------------------------------------------------
        # SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) HEALTHKIT_ENABLED
        # CODE_SIGN_ENTITLEMENTS: Support/MuscuLog.entitlements

  MuscuLogTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: MuscuLogTests
    dependencies:
      - target: MuscuLog
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.musculog.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/MuscuLog.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/MuscuLog"
        BUNDLE_LOADER: "$(TEST_HOST)"

# ---------------------------------------------------------------------------
# Cible Widget (optionnelle) — voir Widget/README-WIDGET.md.
# Un widget d'écran d'accueil exige un App Group partagé, donc un compte
# développeur payant. Le code est fourni mais volontairement NON embarqué par
# défaut : un .app contenant une extension non signable fait échouer Sideloadly.
# Pour l'activer (compte payant) :
#   1. décommenter le bloc ci-dessous
#   2. ajouter le widget comme dépendance embarquée de la cible MuscuLog :
#        dependencies:
#          - target: MuscuLogWidget
#            embed: true
#   3. ajouter l'App Group "group.com.example.musculog" aux DEUX cibles et
#      régénérer les profils de provisionnement (Sideloadly : cocher l'entitlement)
# ---------------------------------------------------------------------------
#  MuscuLogWidget:
#    type: app-extension
#    platform: iOS
#    deploymentTarget: "17.0"
#    sources:
#      - path: Widget
#      - path: MuscuLog/Models
#      - path: MuscuLog/Support
#      - path: MuscuLog/ViewModels/StatsViewModel.swift
#      - path: MuscuLog/Services/WidgetSnapshot.swift
#    settings:
#      base:
#        PRODUCT_BUNDLE_IDENTIFIER: com.example.musculog.widget
#        GENERATE_INFOPLIST_FILE: NO
#        INFOPLIST_FILE: Support/WidgetInfo.plist
#        SKIP_INSTALL: YES
#        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) WIDGET_TARGET

schemes:
  MuscuLog:
    build:
      targets:
        MuscuLog: all
        MuscuLogTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - MuscuLogTests
    archive:
      config: Release
